name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  # Called by daily-blog.yml after it commits a new article: a push made with
  # GITHUB_TOKEN does not trigger workflows, so the deploy has to be chained.
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build (defaults to the tip of main)"
        type: string
        default: main

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Empty on push/dispatch, so checkout falls back to the triggering ref.
          ref: ${{ inputs.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run build
        env:
          NODE_ENV: production

      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          # GitHub's Pages deployment backend has been sitting in
          # "deployment_queued" and tripping the default 10-min timeout.
          # Give it more room so a slow (but recovering) backend can finish.
          timeout: 1800000
          error_count: 20
