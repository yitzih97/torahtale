name: Daily blog post

# Writes one new blog article a day and deploys it.
#
# Sunday–Thursday only, and deliberately so: the run commits to main and
# publishes the site, and we don't want either happening on erev Shabbos or on
# Shabbos itself. That's five fresh articles a week; to publish seven, add
# `5,6` to the cron's day-of-week field.
#
# The deploy is chained as a reusable workflow rather than left to the push
# event, because a push made with GITHUB_TOKEN does not trigger other workflows.

on:
  schedule:
    - cron: "0 11 * * 0-4" # 07:00 America/New_York during EDT, Sun–Thu
  workflow_dispatch:
    inputs:
      count:
        description: "How many articles to write in this run"
        type: string
        default: "1"
      topic:
        description: "Force a story (a TORAH_PORTIONS value, e.g. noach). Blank = the agent chooses."
        type: string
        default: ""
      plan:
        description: "Only print what it would write — no API call, no commit"
        type: boolean
        default: false

concurrency:
  group: daily-blog
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Installed here rather than added to the site's dependencies: the agent
      # runs in CI only, and the Pages build uses `bun install --frozen-lockfile`.
      - name: Install the Anthropic SDK
        run: npm install --no-save --no-package-lock @anthropic-ai/sdk

      - name: Write the article
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLOG_MODEL: ${{ vars.BLOG_MODEL }}
          INPUT_COUNT: ${{ inputs.count || '1' }}
          INPUT_TOPIC: ${{ inputs.topic }}
          INPUT_PLAN: ${{ inputs.plan }}
        run: |
          set -euo pipefail
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::error::ANTHROPIC_API_KEY repo secret is not set."; exit 1
          fi
          args=(--count "$INPUT_COUNT")
          if [ -n "$INPUT_TOPIC" ]; then args+=(--topic "$INPUT_TOPIC"); fi
          if [ "$INPUT_PLAN" = "true" ]; then args+=(--plan); fi
          node scripts/blog-agent.mjs "${args[@]}"

      - name: Check the article builds
        if: ${{ inputs.plan != true }}
        run: |
          node -e "
            import('./src/content/blog/index.mjs').then((m) => {
              if (!m.ARTICLES.length) throw new Error('no articles');
              console.log(m.ARTICLES.length + ' articles, newest: ' + m.ARTICLES[0].slug);
            });
          "

      - name: Commit
        id: commit
        if: ${{ inputs.plan != true }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain src/content/blog/stories)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing new to publish."
            exit 0
          fi
          slug=$(git status --porcelain src/content/blog/stories \
            | grep -oE '[^/]+\.mjs' | grep -v '^index\.mjs$' | head -1 | sed 's/\.mjs$//')
          git config user.name "torahtale-blog-bot"
          git config user.email "bot@torahtale.com"
          git add src/content/blog/stories
          git commit -m "Blog: ${slug}"
          # Writing an article takes minutes, and main moves while it does — so
          # rebase onto whatever landed meanwhile rather than losing the article
          # to a rejected push. The commit only ever adds files under
          # src/content/blog/stories, so there is nothing for it to conflict with.
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && break
            if [ "$i" = 3 ]; then echo "::error::could not push the article after 3 tries"; exit 1; fi
            sleep $((i * 10))
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: write
    if: needs.write.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
